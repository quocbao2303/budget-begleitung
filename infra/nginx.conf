server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  absolute_redirect off;
  port_in_redirect off;
  etag on;
  keepalive_timeout 65;
  # No application access logging: no query strings, care inputs, referrers or user agents.
  access_log off;
  error_log /dev/stderr warn;
  include /etc/nginx/security-headers.conf;
  if ($host = www.budget-begleitung.de) { return 308 https://budget-begleitung.de$request_uri; }
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml application/wasm;
  location = /healthz { default_type text/plain; return 200 'ok\n'; }
  location ~ /\. { return 404; }
  location ~* ^/(docs|reference|assets-source|infra|scripts|src|node_modules)(/|$) { return 404; }
  location /_astro/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }
  location ~* ^/(fonts|media|pagefind)/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control 'public, max-age=86400, must-revalidate';
  }
  location / {
    try_files $uri $uri/ =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control 'public, max-age=0, must-revalidate';
  }
  error_page 404 = @redirect_to_home;
  location @redirect_to_home {
    return 301 /;
  }
}
